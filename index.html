<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeeD | Self-Drive & Luxury Rentals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060709;
      color: #f1f5f9;
    }
    .font-brand {
      font-family: 'Orbitron', sans-serif;
    }
    .brand-gradient {
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
    }
    .brand-glow {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.35);
    }
    .cyan-border {
      border: 1px solid rgba(0, 229, 255, 0.25);
    }
    .active-pill {
      background: rgba(0, 229, 255, 0.15) !important;
      border-color: #00e5ff !important;
      color: #00e5ff !important;
      font-weight: 700 !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center bg-black min-h-screen">

  <div class="w-full max-w-[480px] bg-[#090b10] min-h-screen flex flex-col pb-20 shadow-2xl relative border-x border-neutral-900">

    <header class="sticky top-0 z-40 bg-[#090b10]/95 backdrop-blur-md px-4 py-3 border-b border-neutral-800/80 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-[#11141c] border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-brand font-black text-sm brand-glow">
          N
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="text-base font-black italic tracking-wider font-brand text-white">NeeD</span>
          <span class="text-[8px] bg-cyan-950 text-cyan-400 border border-cyan-500/30 px-1.5 py-0.2 rounded font-bold uppercase">GCR</span>
        </div>
      </div>

      <a href="tel:9731055500" class="w-9 h-9 rounded-full bg-[#121620] border border-cyan-500/30 flex items-center justify-center text-cyan-400 active:scale-95 transition">
        <i data-lucide="phone-call" class="w-4 h-4"></i>
      </a>
    </header>

    <div class="p-4">
      <div class="bg-[#10141f] rounded-2xl p-3.5 cyan-border brand-glow relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>

        <div class="space-y-2.5">
          <div class="flex items-center bg-[#171c2b] rounded-xl px-3 py-2.5 border border-neutral-800">
            <div class="w-6 h-6 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 mr-2.5 shrink-0">
              <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
            </div>
            <div class="flex-1">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-0.5">Pickup Location</label>
              <input type="text" id="pickup-location" value="Doorstep Delivery / Airport Drop" class="bg-transparent text-xs font-semibold text-white focus:outline-none w-full">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="bg-[#171c2b] rounded-xl px-3 py-2 border border-neutral-800">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-1">Start Date</label>
              <input type="datetime-local" id="start-date" class="bg-transparent text-[11px] font-medium text-white focus:outline-none w-full [color-scheme:dark]">
            </div>

            <div class="bg-[#171c2b] rounded-xl px-3 py-2 border border-neutral-800">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-1">End Date</label>
              <input type="datetime-local" id="end-date" class="bg-transparent text-[11px] font-medium text-white focus:outline-none w-full [color-scheme:dark]">
            </div>
          </div>

          <button onclick="document.getElementById('fleet-feed').scrollIntoView({behavior: 'smooth'})" class="w-full brand-gradient py-3 rounded-xl text-black font-extrabold text-xs uppercase tracking-wider flex items-center justify-center space-x-2 active:scale-[0.98] transition">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>Browse Live Fleet</span>
          </button>
        </div>
      </div>
    </div>

    <div class="px-4 pb-2">
      <div id="filter-pills" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">
        <button onclick="setCategoryFilter('All', this)" class="active-pill border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full whitespace-nowrap shrink-0 transition">All Cars</button>
        <button onclick="setCategoryFilter('Luxury SUVs', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Luxury SUVs</button>
        <button onclick="setCategoryFilter('Sedans', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Sedans</button>
        <button onclick="setCategoryFilter('Automatic', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Automatic</button>
        <button onclick="setCategoryFilter('7 Seater', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">7 Seater</button>
      </div>
    </div>

    <div id="fleet-feed" class="px-4 space-y-3.5 mt-1">
      <div class="py-12 text-center text-xs text-neutral-500">
        <div class="inline-block w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mb-2"></div>
        <p>Loading live fleet inventory...</p>
      </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-center bg-black/90 backdrop-blur-lg border-t border-neutral-850 py-2">
      <div class="w-full max-w-[480px] flex items-center justify-around px-2 text-neutral-400">
        <a href="#" class="flex flex-col items-center text-cyan-400">
          <i data-lucide="compass" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-bold">Explore</span>
        </a>

        <a href="tel:9731055500" class="flex flex-col items-center hover:text-white transition">
          <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">My Trips</span>
        </a>

        <a href="https://wa.me/919731055500" target="_blank" class="flex flex-col items-center hover:text-emerald-400 transition">
          <i data-lucide="message-square" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">Chat</span>
        </a>

        <button type="button" onclick="toggleAccountDrawer()" class="flex flex-col items-center hover:text-cyan-400 transition focus:outline-none">
          <i data-lucide="user" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium" id="nav-account-label">My Account</span>
        </button>
      </div>
    </nav>

    <div id="account-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center p-4 hidden transition-all duration-300">
      <div class="w-full max-w-[420px] bg-[#0d111a] border border-neutral-800/90 rounded-3xl p-6 shadow-2xl flex flex-col relative overflow-hidden brand-glow">
        
        <div class="flex items-center justify-between pb-4">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-[#131926] border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-brand font-black text-sm">
              N
            </div>
            <h2 class="text-base font-bold text-white font-brand tracking-wide">My Account</h2>
          </div>
          <button onclick="toggleAccountDrawer()" class="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400 hover:text-white transition">
            ✕
          </button>
        </div>

        <div id="auth-view" class="space-y-4 pt-1">
          <div class="flex bg-[#141926] p-1 rounded-2xl border border-neutral-800">
            <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-xs font-bold rounded-xl brand-gradient text-black transition shadow-md">
              Sign In
            </button>
            <button id="tab-signup-btn" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-neutral-400 hover:text-white transition">
              Create Account
            </button>
          </div>

          <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3 pt-1">
            <div id="signup-name-field" class="hidden">
              <label class="text-[11px] text-neutral-400 block mb-1 font-medium">Full Legal Name</label>
              <input type="text" id="auth-name" placeholder="e.g. Rahul Sharma" class="w-full bg-[#141926] border border-neutral-800 rounded-2xl px-4 py-3 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-cyan-400 transition">
            </div>

            <div>
              <label class="text-[11px] text-neutral-400 block mb-1 font-medium">Mobile Number</label>
              <div class="flex items-center bg-[#141926] border border-neutral-800 rounded-2xl px-4 py-3 focus-within:border-cyan-400 transition">
                <span class="text-xs font-bold text-neutral-400 mr-2 border-r border-neutral-700 pr-2.5">+91</span>
                <input type="tel" id="auth-phone" maxlength="10" placeholder="97310 55500" required class="bg-transparent text-xs font-semibold text-white focus:outline-none w-full tracking-wider placeholder-neutral-500">
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="text-[11px] text-neutral-400 font-medium">Password</label>
                <button type="button" id="forgot-pass-btn" onclick="showForgotPasswordView()" class="text-[11px] text-cyan-400 hover:underline">
                  Forgot Password?
                </button>
              </div>
              <input type="password" id="auth-password" placeholder="••••••••" required class="w-full bg-[#141926] border border-neutral-800 rounded-2xl px-4 py-3 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-cyan-400 transition">
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full brand-gradient text-black font-extrabold text-xs uppercase py-3.5 rounded-2xl hover:brightness-
