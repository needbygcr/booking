<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeeD | Self-Drive & Luxury Rentals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #eaf3f6;
      color: #1e293b;
    }
    .font-brand {
      font-family: 'Orbitron', sans-serif;
    }
    
    /* Speech bubble arrow on active tab */
    .tab-arrow::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #ffffff;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center bg-[#dbe8ed] min-h-screen p-0 sm:p-4">

  <div class="w-full max-w-[480px] bg-white min-h-screen flex flex-col pb-20 shadow-xl relative sm:rounded-3xl overflow-hidden">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-5 py-3.5 border-b border-neutral-150 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-[#3ba2b8] flex items-center justify-center text-white font-brand font-black text-sm shadow-md">
          N
        </div>
        <span class="text-base font-black italic tracking-wider font-brand text-slate-800">NeeD</span>
      </div>

      <a href="tel:9731055500" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-[#3ba2b8] active:scale-95 transition">
        <i data-lucide="phone-call" class="w-4 h-4"></i>
      </a>
    </header>

    <!-- ================= 1. REVV STYLE HERO SEARCH CARD (IMAGE 2 MATCH) ================= -->
    <div class="p-4">
      <div class="bg-white rounded-3xl p-5 shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 flex flex-col items-center">
        
        <!-- Teal Segmented Header Bar -->
        <div class="w-full bg-[#3ba2b8] p-1.5 rounded-2xl flex items-center relative">
          
          <!-- Tab 1: Rental (Active Speech Bubble) -->
          <button id="tab-rental" onclick="switchBookingType('rental')" class="flex-1 py-3 px-2 rounded-xl bg-white text-center shadow-md relative tab-arrow transition duration-200">
            <h4 class="text-xs sm:text-sm font-extrabold text-slate-800 leading-tight">Rental</h4>
            <p class="text-[10px] text-slate-500 font-medium mt-0.5">For hours & days</p>
          </button>
          
          <!-- Tab 2: Subscriptions -->
          <button id="tab-sub" onclick="switchBookingType('subscription')" class="flex-1 py-3 px-2 rounded-xl text-center text-white transition duration-200 opacity-90 hover:opacity-100">
            <h4 class="text-xs sm:text-sm font-extrabold leading-tight">Subscriptions</h4>
            <p class="text-[10px] text-teal-100 font-medium mt-0.5">For more than 7 days</p>
          </button>
        </div>

        <!-- Center Brand Typography -->
        <div class="text-center py-6">
          <div class="flex items-center justify-center space-x-0.5">
            <span class="text-2xl font-black text-slate-800 tracking-tight">R</span>
            <span class="text-2xl font-black text-[#3ba2b8] tracking-tight">entals</span>
          </div>
          <p class="text-xs font-semibold text-slate-500 mt-1">Largest company-owned fleet in India</p>
        </div>

        <!-- Location Search Bar Trigger -->
        <div onclick="openLocationPicker()" class="w-full flex items-center justify-between bg-white border border-slate-200/90 hover:border-[#3ba2b8] rounded-full px-4 py-3.5 shadow-[0_4px_20px_rgba(0,0,0,0.04)] cursor-pointer transition active:scale-[0.98]">
          <div class="flex items-center space-x-3 min-w-0">
            <div class="w-8 h-8 rounded-full bg-[#e8f5f7] flex items-center justify-center text-[#3ba2b8] shrink-0">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <span id="selected-location-label" class="text-xs font-bold text-slate-400 truncate">Select location to search</span>
          </div>
          <div class="text-rose-500 pl-2 shrink-0">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </div>
        </div>

      </div>
    </div>

    <!-- Category Filters -->
    <div class="px-4 pb-2">
      <div id="filter-pills" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">
        <button onclick="setCategoryFilter('All', this)" class="bg-[#3ba2b8] text-white font-bold px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 shadow-sm transition">All Cars</button>
        <button onclick="setCategoryFilter('Luxury SUVs', this)" class="bg-slate-100 text-slate-600 font-medium px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 hover:bg-slate-200 transition">Luxury SUVs</button>
        <button onclick="setCategoryFilter('Sedans', this)" class="bg-slate-100 text-slate-600 font-medium px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 hover:bg-slate-200 transition">Sedans</button>
        <button onclick="setCategoryFilter('Automatic', this)" class="bg-slate-100 text-slate-600 font-medium px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 hover:bg-slate-200 transition">Automatic</button>
      </div>
    </div>

    <!-- Fleet Feed -->
    <div id="fleet-feed" class="px-4 space-y-3.5 mt-1">
      <div class="py-12 text-center text-xs text-slate-400">
        <div class="inline-block w-6 h-6 border-2 border-[#3ba2b8] border-t-transparent rounded-full animate-spin mb-2"></div>
        <p>Loading fleet inventory...</p>
      </div>
    </div>

    <!-- ================= 2. POPUP MODAL (IMAGE 1 MATCH) ================= -->
    <div id="location-picker-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-center items-center p-4 hidden">
      <div class="w-full max-w-[420px] bg-white rounded-3xl p-6 shadow-2xl flex flex-col h-[580px] relative">
        
        <!-- Header -->
        <div class="flex items-center space-x-3 pb-3">
          <button onclick="closeLocationPicker()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition active:scale-95">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h3 class="text-sm sm:text-base font-bold text-slate-700">Where do you want the car?</h3>
        </div>

        <!-- Search Input Bar -->
        <div class="mt-2">
          <div class="flex items-center bg-[#f1f4f6] rounded-full px-4 py-3 border border-transparent focus-within:border-[#3ba2b8] transition">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2.5 shrink-0"></i>
            <input type="text" id="modal-search-input" oninput="handleAddressAutocomplete(this.value)" placeholder="Search address, airport or hotel" class="w-full bg-transparent text-xs font-semibold text-slate-700 placeholder-slate-400 focus:outline-none">
            <button onclick="clearSearchInput()" class="text-slate-400 hover:text-slate-600 text-xs px-1">✕</button>
          </div>
          <p class="text-[10px] text-[#3ba2b8] font-medium mt-1.5 px-3">Please enter locality to get customised results</p>
        </div>

        <!-- Use Current Location Action -->
        <button onclick="useCurrentLocation()" class="w-full mt-4 flex items-center space-x-3.5 p-2 rounded-2xl hover:bg-slate-50 text-left transition active:scale-[0.99]">
          <div class="w-10 h-10 rounded-full bg-[#e8f5f7] flex items-center justify-center text-[#3ba2b8] shrink-0">
            <i data-lucide="crosshair" class="w-4 h-4"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-[#3ba2b8]">Use current location</h4>
            <p class="text-[10px] text-slate-400 truncate">Enable location for better experience</p>
          </div>
        </button>

        <div class="h-px bg-slate-100 my-3"></div>

        <!-- Recent Searches Header & Result Container -->
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="flex items-center space-x-2 text-slate-400 text-xs px-1 pb-2">
            <i data-lucide="history" class="w-3.5 h-3.5 text-slate-400"></i>
            <span id="results-header-text" class="font-medium">No recent searches</span>
          </div>

          <div id="location-results-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 no-scrollbar">
            <!-- Empty State Centered Magnifier (Image 1) -->
            <div id="empty-state-icon" class="h-full flex items-center justify-center opacity-15 pointer-events-none">
              <i data-lucide="search" class="w-24 h-24 text-slate-500"></i>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 flex justify-center bg-white/95 backdrop-blur-lg border-t border-slate-200 py-2.5">
      <div class="w-full max-w-[480px] flex items-center justify-around px-2 text-slate-400">
        <a href="#" class="flex flex-col items-center text-[#3ba2b8]">
          <i data-lucide="compass" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-bold">Explore</span>
        </a>
        <a href="tel:9731055500" class="flex flex-col items-center hover:text-slate-700 transition">
          <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">My Trips</span>
        </a>
        <a href="tel:9731055500" class="flex flex-col items-center hover:text-slate-700 transition">
          <i data-lucide="phone-call" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">Contact</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCuwgY2-XIq08K8BO7yGClEFjSvoUNJLtc",
      authDomain: "need-car.firebaseapp.com",
      projectId: "need-car",
      storageBucket: "need-car.firebasestorage.app",
      messagingSenderId: "550107299117",
      appId: "1:550107299117:web:7e6ff6445d681364df27a4"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allFleetCars = [];
    let selectedCategory = "All";
    let bookingType = "rental";
    let selectedLocation = "";
    let debounceTimer = null;

    // --- 2. SWITCH TABS WITH SPEECH BUBBLE ARROW ---
    function switchBookingType(type) {
      bookingType = type;
      const tabRental = document.getElementById("tab-rental");
      const tabSub = document.getElementById("tab-sub");

      if (type === "rental") {
        tabRental.className = "flex-1 py-3 px-2 rounded-xl bg-white text-center shadow-md relative tab-arrow transition duration-200 text-slate-800";
        tabSub.className = "flex-1 py-3 px-2 rounded-xl text-center text-white transition duration-200 opacity-90 hover:opacity-100";
      } else {
        tabSub.className = "flex-1 py-3 px-2 rounded-xl bg-white text-center shadow-md relative tab-arrow transition duration-200 text-slate-800";
        tabRental.className = "flex-1 py-3 px-2 rounded-xl text-center text-white transition duration-200 opacity-90 hover:opacity-100";
      }
    }

    // --- 3. MODAL CONTROLS & REALTIME AUTOCOMPLETE ---
    function openLocationPicker() {
      const modal = document.getElementById("location-picker-modal");
      modal.classList.remove("hidden");
      const input = document.getElementById("modal-search-input");
      input.value = selectedLocation;
      input.focus();
      loadRecentSearches();
      lucide.createIcons();
    }

    function closeLocationPicker() {
      document.getElementById("location-picker-modal").classList.add("hidden");
    }

    function clearSearchInput() {
      document.getElementById("modal-search-input").value = "";
      loadRecentSearches();
    }

    function handleAddressAutocomplete(query) {
      clearTimeout(debounceTimer);
      const queryTrim = query.trim();
      const listContainer = document.getElementById("location-results-list");
      const headerText = document.getElementById("results-header-text");

      if (!queryTrim || queryTrim.length < 2) {
        loadRecentSearches();
        return;
      }

      headerText.innerText = "Suggested Locations";
      listContainer.innerHTML = `
        <div class="py-8 text-center text-xs text-slate-400 flex items-center justify-center space-x-2">
          <div class="w-4 h-4 border-2 border-[#3ba2b8] border-t-transparent rounded-full animate-spin"></div>
          <span>Searching addresses...</span>
        </div>
      `;

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(queryTrim)}&limit=5`);
          const data = await res.json();
          renderSuggestions(data.features || []);
        } catch (err) {
          listContainer.innerHTML = `<div class="py-6 text-center text-xs text-slate-400">Press enter to select "${queryTrim}"</div>`;
        }
      }, 300);
    }

    function renderSuggestions(features) {
      const listContainer = document.getElementById("location-results-list");
      listContainer.innerHTML = "";

      if (!features.length) {
        listContainer.innerHTML = `<div class="py-8 text-center text-xs text-slate-400">No matching locations found.</div>`;
        return;
      }

      features.forEach(item => {
        const props = item.properties;
        const mainText = props.name || props.street || "Location Pin";
        const secondary = [props.city, props.state, props.country].filter(Boolean).join(", ");
        const fullAddress = `${mainText}${secondary ? ', ' + secondary : ''}`;

        const row = document.createElement("div");
        row.className = "flex items-center space-x-3 py-3 px-2 hover:bg-slate-50 cursor-pointer rounded-xl transition";
        row.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-[#e8f5f7] flex items-center justify-center text-[#3ba2b8] shrink-0">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold text-slate-800 truncate">${mainText}</p>
            <p class="text-[10px] text-slate-400 truncate">${secondary}</p>
          </div>
        `;
        row.onclick = () => selectLocation(fullAddress);
        listContainer.appendChild(row);
      });
      lucide.createIcons();
    }

    function selectLocation(addressString) {
      selectedLocation = addressString;
      const label = document.getElementById("selected-location-label");
      label.innerText = addressString;
      label.className = "text-xs font-bold text-slate-800 truncate";

      saveToRecents(addressString);
      closeLocationPicker();
    }

    function saveToRecents(address) {
      let recents = JSON.parse(localStorage.getItem("need_recents") || "[]");
      recents = recents.filter(item => item !== address);
      recents.unshift(address);
      if (recents.length > 4) recents.pop();
      localStorage.setItem("need_recents", JSON.stringify(recents));
    }

    function loadRecentSearches() {
      const listContainer = document.getElementById("location-results-list");
      const headerText = document.getElementById("results-header-text");
      const recents = JSON.parse(localStorage.getItem("need_recents") || "[]");

      if (!recents.length) {
        headerText.innerText = "No recent searches";
        listContainer.innerHTML = `
          <div class="h-full flex items-center justify-center py-12 opacity-15 pointer-events-none">
            <i data-lucide="search" class="w-24 h-24 text-slate-500"></i>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      headerText.innerText = "Recent Searches";
      listContainer.innerHTML = "";
      recents.forEach(address => {
        const row = document.createElement("div");
        row.className = "flex items-center space-x-3 py-2.5 px-2 hover:bg-slate-50 cursor-pointer rounded-xl transition";
        row.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 shrink-0">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-semibold text-slate-700 truncate">${address}</p>
          </div>
        `;
        row.onclick = () => selectLocation(address);
        listContainer.appendChild(row);
      });
      lucide.createIcons();
    }

    function useCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          () => selectLocation("Current GPS Location"),
          () => alert("Please allow location permissions.")
        );
      } else {
        alert("Geolocation not supported.");
      }
    }

    // --- 4. FLEET FEED ---
    db.collection("fleet").onSnapshot(snapshot => {
      allFleetCars = [];
      snapshot.forEach(doc => allFleetCars.push({ id: doc.id, ...doc.data() }));
      renderFleetCards();
    });

    function setCategoryFilter(category, btn) {
      selectedCategory = category;
      document.querySelectorAll("#filter-pills button").forEach(b => {
        b.className = "bg-slate-100 text-slate-600 font-medium px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 hover:bg-slate-200 transition";
      });
      btn.className = "bg-[#3ba2b8] text-white font-bold px-4 py-1.5 rounded-full whitespace-nowrap shrink-0 shadow-sm transition";
      renderFleetCards();
    }

    function renderFleetCards() {
      const feed = document.getElementById("fleet-feed");
      const filtered = allFleetCars.filter(c => selectedCategory === "All" || c.category === selectedCategory);

      if (!filtered.length) {
        feed.innerHTML = `<div class="py-12 text-center text-xs text-slate-400"><p>No vehicles found.</p></div>`;
        return;
      }

      feed.innerHTML = "";
      filtered.forEach(car => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl border border-slate-100 p-3 shadow-md space-y-2";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-sm font-bold text-slate-800">${car.name}</h3>
              <p class="text-[10px] text-slate-400">${car.specs || 'Automatic • Luxury'}</p>
            </div>
            <span class="text-sm font-bold text-[#3ba2b8]">₹${Number(car.price).toLocaleString('en-IN')}/day</span>
          </div>
          <button onclick="handleBooking('${encodeURIComponent(car.name)}')" class="w-full bg-[#3ba2b8] hover:bg-[#328f9d] text-white font-bold text-xs uppercase tracking-wider py-2.5 rounded-xl transition active:scale-95 shadow-sm">
            Book Car
          </button>
        `;
        feed.appendChild(card);
      });
      lucide.createIcons();
    }

    function handleBooking(carName) {
      const location = selectedLocation || "Not specified";
      const text = `Hello NeeD, I want to book ${decodeURIComponent(carName)} (${bookingType.toUpperCase()}).\nSelected Location: ${location}`;
      window.open(`https://wa.me/919731055500?text=${encodeURIComponent(text)}`, '_blank');
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
