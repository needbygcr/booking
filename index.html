<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeeD | Self-Drive & Luxury Rentals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060709;
      color: #f1f5f9;
    }
    .font-brand {
      font-family: 'Orbitron', sans-serif;
    }
    .brand-gradient {
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
    }
    .brand-glow {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.35);
    }
    .cyan-border {
      border: 1px solid rgba(0, 229, 255, 0.25);
    }
    .active-pill {
      background: rgba(0, 229, 255, 0.15) !important;
      border-color: #00e5ff !important;
      color: #00e5ff !important;
      font-weight: 700 !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center bg-black min-h-screen">

  <div class="w-full max-w-[480px] bg-[#090b10] min-h-screen flex flex-col pb-20 shadow-2xl relative border-x border-neutral-900">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#090b10]/95 backdrop-blur-md px-4 py-3 border-b border-neutral-800/80 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-[#11141c] border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-brand font-black text-sm brand-glow">
          N
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="text-base font-black italic tracking-wider font-brand text-white">NeeD</span>
          <span class="text-[8px] bg-cyan-950 text-cyan-400 border border-cyan-500/30 px-1.5 py-0.2 rounded font-bold uppercase">GCR</span>
        </div>
      </div>

      <a href="tel:9731055500" class="w-9 h-9 rounded-full bg-[#121620] border border-cyan-500/30 flex items-center justify-center text-cyan-400 active:scale-95 transition">
        <i data-lucide="phone-call" class="w-4 h-4"></i>
      </a>
    </header>

    <!-- Main Booking Search Widget -->
    <div class="p-4">
      <div class="bg-[#10141f] rounded-2xl p-3.5 cyan-border brand-glow relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>

        <div class="space-y-2.5">
          
          <!-- Single Location / Entry Point Card -->
          <div onclick="openLocationPicker()" class="flex items-center bg-[#171c2b] rounded-xl px-3.5 py-3 border border-neutral-800 hover:border-cyan-500/40 cursor-pointer transition">
            <div class="w-7 h-7 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 mr-3 shrink-0">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-1 pointer-events-none">Location / Entry Point</label>
              <div id="home-location-display" class="text-xs font-bold text-cyan-300 truncate">Doorstep Delivery</div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-500 shrink-0"></i>
          </div>

          <!-- Dates -->
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-[#171c2b] rounded-xl px-3 py-2 border border-neutral-800">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-1">Start Date</label>
              <input type="datetime-local" id="start-date" class="bg-transparent text-[11px] font-medium text-white focus:outline-none w-full [color-scheme:dark]">
            </div>

            <div class="bg-[#171c2b] rounded-xl px-3 py-2 border border-neutral-800">
              <label class="text-[9px] uppercase font-bold text-neutral-400 block tracking-wider leading-none mb-1">End Date</label>
              <input type="datetime-local" id="end-date" class="bg-transparent text-[11px] font-medium text-white focus:outline-none w-full [color-scheme:dark]">
            </div>
          </div>

          <button onclick="document.getElementById('fleet-feed').scrollIntoView({behavior: 'smooth'})" class="w-full brand-gradient py-3 rounded-xl text-black font-extrabold text-xs uppercase tracking-wider flex items-center justify-center space-x-2 active:scale-[0.98] transition">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>Browse Live Fleet</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="px-4 pb-2">
      <div id="filter-pills" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">
        <button onclick="setCategoryFilter('All', this)" class="active-pill border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full whitespace-nowrap shrink-0 transition">All Cars</button>
        <button onclick="setCategoryFilter('Luxury SUVs', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Luxury SUVs</button>
        <button onclick="setCategoryFilter('Sedans', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Sedans</button>
        <button onclick="setCategoryFilter('Automatic', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">Automatic</button>
        <button onclick="setCategoryFilter('7 Seater', this)" class="border border-neutral-800 bg-[#121622] text-neutral-400 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap shrink-0 transition">7 Seater</button>
      </div>
    </div>

    <!-- Fleet Feed -->
    <div id="fleet-feed" class="px-4 space-y-3.5 mt-1">
      <div class="py-12 text-center text-xs text-neutral-500">
        <div class="inline-block w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mb-2"></div>
        <p>Loading live fleet inventory...</p>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 flex justify-center bg-black/90 backdrop-blur-lg border-t border-neutral-850 py-2">
      <div class="w-full max-w-[480px] flex items-center justify-around px-2 text-neutral-400">
        <a href="#" class="flex flex-col items-center text-cyan-400">
          <i data-lucide="compass" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-bold">Explore</span>
        </a>

        <a href="tel:9731055500" class="flex flex-col items-center hover:text-white transition">
          <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">My Trips</span>
        </a>

       <button type="button" onclick="toggleChatDrawer()" class="flex flex-col items-center hover:text-cyan-400 transition focus:outline-none">
          <i data-lucide="message-square" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium">Chat</span>
        </button>

        <button type="button" onclick="toggleAccountDrawer()" class="flex flex-col items-center hover:text-cyan-400 transition focus:outline-none">
          <i data-lucide="user" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[10px] font-medium" id="nav-account-label">My Account</span>
        </button>
      </div>
    </nav>

    <!-- ================= SINGLE LOCATION PICKER MODAL ================= -->
    <div id="location-picker-modal" class="fixed inset-0 z-50 bg-[#090b10] flex justify-center hidden">
      <div class="w-full max-w-[480px] min-h-screen bg-[#090b10] flex flex-col p-4 relative">
        
        <!-- Header -->
        <div class="flex items-center space-x-3 pt-2 pb-3">
          <button onclick="closeLocationPicker()" class="w-9 h-9 rounded-full bg-[#121724] border border-neutral-800 flex items-center justify-center text-neutral-400 hover:text-white transition active:scale-95">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
          <h2 class="text-sm font-bold text-white font-brand">Enter Location / Entry Point</h2>
        </div>

        <!-- Search Input Field -->
        <div class="mt-2">
          <div class="flex items-center bg-[#131826] border border-cyan-500/50 rounded-2xl px-3.5 py-3 transition brand-glow">
            <i data-lucide="search" class="w-4 h-4 text-cyan-400 mr-2.5 shrink-0"></i>
            <input type="text" id="modal-location-input" oninput="handleAddressAutocomplete(this.value)" placeholder="Search address, hotel, airport or landmark" class="w-full bg-transparent text-xs font-semibold text-white placeholder-neutral-500 focus:outline-none">
            <button onclick="clearLocationInput()" class="text-neutral-500 hover:text-white text-xs px-1">✕</button>
          </div>
          <p class="text-[10px] text-cyan-400/90 font-medium mt-2 px-2 flex items-center">
            <i data-lucide="sparkles" class="w-3 h-3 mr-1"></i> Live locality search enabled
          </p>
        </div>

        <!-- Quick Select Actions -->
        <div class="mt-4 space-y-2">
          <!-- Default Doorstep Option -->
          <button onclick="selectLocation('Doorstep Delivery')" class="w-full flex items-center space-x-3 p-3 rounded-2xl bg-[#10141f] border border-cyan-500/30 hover:border-cyan-400 text-left transition active:scale-[0.99]">
            <div class="w-8 h-8 rounded-full bg-cyan-950/70 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0">
              <i data-lucide="truck" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-cyan-300">Doorstep Delivery (Default)</h4>
              <p class="text-[10px] text-neutral-400 truncate">Free delivery to your registered address</p>
            </div>
          </button>

          <!-- Current GPS Location Button -->
          <button onclick="useCurrentLocation()" class="w-full flex items-center space-x-3 p-3 rounded-2xl bg-[#10141f] border border-neutral-800 hover:border-cyan-500/40 text-left transition active:scale-[0.99]">
            <div class="w-8 h-8 rounded-full bg-[#171e2e] border border-neutral-700 flex items-center justify-center text-emerald-400 shrink-0">
              <i data-lucide="crosshair" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-neutral-200">Use current GPS location</h4>
              <p class="text-[10px] text-neutral-400 truncate">Detect via device pinpoint</p>
            </div>
          </button>
        </div>

        <div class="h-px bg-neutral-800/80 my-4"></div>

        <!-- Live Suggestions & Recent Searches Container -->
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="flex items-center justify-between pb-2 border-b border-neutral-850">
            <span id="results-header-text" class="text-[10px] uppercase font-bold text-neutral-400 tracking-wider">Recent Searches</span>
          </div>

          <div id="location-results-list" class="flex-1 overflow-y-auto divide-y divide-neutral-850 no-scrollbar py-1">
            <!-- Dynamically populated -->
          </div>
        </div>

      </div>
    </div>

    <!-- Account Drawer (Standard) -->
    <div id="account-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center p-4 hidden transition-all duration-300">
      <div class="w-full max-w-[420px] bg-[#0d111a] border border-neutral-800/90 rounded-3xl p-6 shadow-2xl flex flex-col relative overflow-hidden brand-glow">
        <div class="flex items-center justify-between pb-4">
          <h2 class="text-base font-bold text-white font-brand tracking-wide">My Account</h2>
          <button onclick="toggleAccountDrawer()" class="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400">✕</button>
        </div>
        <div id="auth-view" class="space-y-4 pt-1">
          <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
            <input type="tel" id="auth-phone" maxlength="10" placeholder="Mobile Number" required class="w-full bg-[#141926] border border-neutral-800 rounded-2xl px-4 py-3 text-xs text-white">
            <input type="password" id="auth-password" placeholder="Password" required class="w-full bg-[#141926] border border-neutral-800 rounded-2xl px-4 py-3 text-xs text-white">
            <button type="submit" class="w-full brand-gradient text-black font-extrabold text-xs uppercase py-3.5 rounded-2xl">Sign In</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Concierge Drawer -->
    <div id="chat-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center p-4 hidden">
      <div class="w-full max-w-[420px] h-[500px] bg-[#0d111a] border border-neutral-800 rounded-3xl flex flex-col overflow-hidden shadow-2xl brand-glow p-4">
        <div class="flex justify-between items-center border-b border-neutral-800 pb-2">
          <span class="text-xs font-bold text-cyan-400">Concierge Desk</span>
          <button onclick="toggleChatDrawer()" class="text-neutral-400">✕</button>
        </div>
        <div class="flex-1 flex items-center justify-center text-xs text-neutral-500">Active Concierge Ready</div>
      </div>
    </div>

  </div>

  <script>
    // --- 1. FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCuwgY2-XIq08K8BO7yGClEFjSvoUNJLtc",
      authDomain: "need-car.firebaseapp.com",
      projectId: "need-car",
      storageBucket: "need-car.firebasestorage.app",
      messagingSenderId: "550107299117",
      appId: "1:550107299117:web:7e6ff6445d681364df27a4"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allFleetCars = [];
    let selectedCategory = "All";
    let currentActiveUser = JSON.parse(localStorage.getItem("need_logged_user") || "null");

    // Location State - Default to Doorstep Delivery
    let currentLocation = localStorage.getItem("need_selected_location") || "Doorstep Delivery";
    let debounceTimer = null;

    // --- 2. LOCATION ENGINE ---
    function openLocationPicker() {
      const modal = document.getElementById("location-picker-modal");
      modal.classList.remove("hidden");
      
      const input = document.getElementById("modal-location-input");
      input.value = (currentLocation === "Doorstep Delivery") ? "" : currentLocation;
      input.focus();

      loadRecentSearches();
      lucide.createIcons();
    }

    function closeLocationPicker() {
      document.getElementById("location-picker-modal").classList.add("hidden");
    }

    function clearLocationInput() {
      document.getElementById("modal-location-input").value = "";
      loadRecentSearches();
    }

    // Live Address Search
    function handleAddressAutocomplete(query) {
      clearTimeout(debounceTimer);
      const queryTrim = query.trim();
      const listContainer = document.getElementById("location-results-list");
      const headerText = document.getElementById("results-header-text");

      if (!queryTrim || queryTrim.length < 2) {
        loadRecentSearches();
        return;
      }

      headerText.innerText = "Suggested Locations";
      listContainer.innerHTML = `
        <div class="py-6 text-center text-xs text-neutral-500 flex items-center justify-center space-x-2">
          <div class="w-4 h-4 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
          <span>Searching places...</span>
        </div>
      `;

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(queryTrim)}&limit=6`);
          const data = await res.json();
          renderSuggestions(data.features || []);
        } catch (err) {
          listContainer.innerHTML = `<div class="py-4 text-center text-xs text-neutral-500">Press enter to select "${queryTrim}"</div>`;
        }
      }, 300);
    }

    function renderSuggestions(features) {
      const listContainer = document.getElementById("location-results-list");
      listContainer.innerHTML = "";

      if (!features.length) {
        listContainer.innerHTML = `<div class="py-6 text-center text-xs text-neutral-500">No matching places found.</div>`;
        return;
      }

      features.forEach(item => {
        const props = item.properties;
        const mainText = props.name || props.street || "Location Pin";
        const secondary = [props.city, props.state, props.country].filter(Boolean).join(", ");
        const fullAddress = `${mainText}${secondary ? ', ' + secondary : ''}`;

        const row = document.createElement("div");
        row.className = "flex items-center space-x-3 py-3 px-2 hover:bg-[#131926] cursor-pointer rounded-xl transition";
        row.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-cyan-400 shrink-0">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold text-white truncate">${mainText}</p>
            <p class="text-[10px] text-neutral-400 truncate">${secondary}</p>
          </div>
        `;
        row.onclick = () => selectLocation(fullAddress);
        listContainer.appendChild(row);
      });
      lucide.createIcons();
    }

    function selectLocation(addressString) {
      currentLocation = addressString;
      localStorage.setItem("need_selected_location", addressString);
      
      document.getElementById("home-location-display").innerText = addressString;
      
      if (addressString !== "Doorstep Delivery") {
        saveToRecents(addressString);
      }
      
      closeLocationPicker();
    }

    function saveToRecents(address) {
      let recents = JSON.parse(localStorage.getItem("need_recent_locations") || "[]");
      recents = recents.filter(item => item !== address);
      recents.unshift(address);
      if (recents.length > 5) recents.pop();
      localStorage.setItem("need_recent_locations", JSON.stringify(recents));
    }

    function loadRecentSearches() {
      const listContainer = document.getElementById("location-results-list");
      const headerText = document.getElementById("results-header-text");
      const recents = JSON.parse(localStorage.getItem("need_recent_locations") || "[]");

      headerText.innerText = "Recent Searches";
      listContainer.innerHTML = "";

      if (!recents.length) {
        listContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center py-10 opacity-20 pointer-events-none">
            <i data-lucide="map-pin" class="w-16 h-16 text-cyan-400 mb-2"></i>
            <p class="text-xs text-neutral-400">No recent locations</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      recents.forEach(address => {
        const row = document.createElement("div");
        row.className = "flex items-center space-x-3 py-2.5 px-2 hover:bg-[#131926] cursor-pointer rounded-xl transition";
        row.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400 shrink-0">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-semibold text-neutral-300 truncate">${address}</p>
          </div>
        `;
        row.onclick = () => selectLocation(address);
        listContainer.appendChild(row);
      });
      lucide.createIcons();
    }

    function useCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            selectLocation("Current GPS Location");
          },
          (error) => {
            alert("Please allow location permissions in your browser settings.");
          }
        );
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    // --- 3. FLEET LISTENER & DISPATCH ---
    db.collection("fleet").onSnapshot(snapshot => {
      allFleetCars = [];
      snapshot.forEach(doc => allFleetCars.push({ id: doc.id, ...doc.data() }));
      renderFleetCards();
    });

    function setCategoryFilter(category, btn) {
      selectedCategory = category;
      document.querySelectorAll("#filter-pills button").forEach(b => b.classList.remove("active-pill"));
      btn.classList.add("active-pill");
      renderFleetCards();
    }

    function renderFleetCards() {
      const feed = document.getElementById("fleet-feed");
      const filtered = allFleetCars.filter(c => selectedCategory === "All" || c.category === selectedCategory);
      if (!filtered.length) {
        feed.innerHTML = `<div class="py-12 text-center text-xs text-neutral-500"><p>No vehicles found.</p></div>`;
        return;
      }
      feed.innerHTML = "";
      filtered.forEach(car => {
        const card = document.createElement("div");
        card.className = "bg-[#10141f] rounded-2xl border border-neutral-800 p-3 shadow-lg space-y-2";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-sm font-bold text-white">${car.name}</h3>
              <p class="text-[10px] text-neutral-400">${car.specs || 'Automatic • Luxury'}</p>
            </div>
            <span class="text-sm font-bold text-cyan-300 font-brand">₹${Number(car.price).toLocaleString('en-IN')}/day</span>
          </div>
          <button onclick="handleBookingAttempt('${encodeURIComponent(car.name)}')" class="w-full brand-gradient py-2.5 rounded-xl text-black font-extrabold text-xs uppercase tracking-wider active:scale-95 transition">
            Book Car
          </button>
        `;
        feed.appendChild(card);
      });
      lucide.createIcons();
    }

    function handleBookingAttempt(carName) {
      const location = currentLocation || "Doorstep Delivery";
      const text = `Hello NeeD by GCR, I want to book ${decodeURIComponent(carName)}.\nLocation / Entry: ${location}`;
      window.open(`https://wa.me/919731055500?text=${encodeURIComponent(text)}`, '_blank');
    }

    function toggleChatDrawer() { document.getElementById("chat-drawer").classList.toggle("hidden"); }
    function toggleAccountDrawer() { document.getElementById("account-drawer").classList.toggle("hidden"); }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("home-location-display").innerText = currentLocation;
      lucide.createIcons();
    });
  </script>
</body>
</html>
